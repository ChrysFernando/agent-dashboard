<style>/* ============================================================
   Aether — Glassmorphic Dark Luxury
   ============================================================ */

:root {
  --bg-0: #04070f;
  --bg-1: #080d1a;
  --bg-2: #0b1226;

  --cyan: #00d4ff;
  --cyan-soft: #6ae7ff;
  --violet: #7b61ff;
  --violet-soft: #a594ff;
  --emerald: #00e5a0;
  --amber: #ffb347;
  --rose: #ff4d6d;

  --text-0: #f4f7ff;
  --text-1: #c8d0e3;
  --text-2: #8a93ab;
  --text-3: #5a6378;

  --glass-bg: rgba(255, 255, 255, 0.045);
  --glass-bg-strong: rgba(255, 255, 255, 0.07);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-strong: rgba(255, 255, 255, 0.14);
  --glass-highlight: rgba(255, 255, 255, 0.12);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 24px;

  --font-ui: 'Sora', system-ui, -apple-system, sans-serif;
  --font-display: 'Bricolage Grotesque', 'Sora', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-ui);
  color: var(--text-0);
  background: var(--bg-0);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.005em;
  font-size: 14px;
}

button { font-family: inherit; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }

/* ---------- Background ---------- */
.bg-aurora {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(1200px 800px at 12% -10%, rgba(123,97,255,0.18), transparent 60%),
    radial-gradient(1000px 700px at 95% 10%, rgba(0,212,255,0.13), transparent 60%),
    radial-gradient(900px 700px at 50% 110%, rgba(0,229,160,0.08), transparent 60%),
    linear-gradient(180deg, #04070f 0%, #060a16 40%, #04070f 100%);
}
.bg-aurora .orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  mix-blend-mode: screen;
  animation: drift 32s ease-in-out infinite;
}
.orb-1 { width: 520px; height: 520px; left: -120px; top: 8%;
  background: radial-gradient(circle, rgba(123,97,255,0.55), transparent 60%); }
.orb-2 { width: 620px; height: 620px; right: -160px; top: 30%;
  background: radial-gradient(circle, rgba(0,212,255,0.45), transparent 60%);
  animation-duration: 38s; animation-delay: -8s; }
.orb-3 { width: 480px; height: 480px; left: 30%; bottom: -180px;
  background: radial-gradient(circle, rgba(0,229,160,0.4), transparent 60%);
  animation-duration: 44s; animation-delay: -16s; }
.orb-4 { width: 360px; height: 360px; right: 22%; bottom: 12%;
  background: radial-gradient(circle, rgba(255,77,109,0.28), transparent 60%);
  animation-duration: 36s; animation-delay: -22s; }

@keyframes drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(60px, -40px) scale(1.08); }
  66% { transform: translate(-40px, 50px) scale(0.95); }
}

.grain {
  pointer-events: none;
  position: fixed; inset: 0; z-index: 9999;
  opacity: 0.035;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMDAnIGhlaWdodD0nMjAwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDEgIDAgMCAwIDAgMSAgMCAwIDAgMCAxICAwIDAgMCAwLjYgMCcvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPScxMDAlJyBoZWlnaHQ9JzEwMCUnIGZpbHRlcj0ndXJsKCNuKScvPjwvc3ZnPg==");
}

/* ---------- Layout ---------- */
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
  position: relative;
}
.app.collapsed { grid-template-columns: 72px 1fr; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky; top: 0; height: 100vh;
  padding: 18px 14px;
  display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--glass-border);
  z-index: 5;
}
.sidebar::before {
  content: ""; position: absolute; inset: 0 -1px 0 auto; width: 1px;
  background: linear-gradient(180deg, transparent, rgba(255,255,255,0.08) 30%, rgba(255,255,255,0.04) 70%, transparent);
  pointer-events: none;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 8px 18px;
  border-bottom: 1px solid var(--glass-border);
  margin-bottom: 10px;
  cursor: pointer;
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px;
  background: conic-gradient(from 210deg, #00d4ff, #7b61ff, #00e5a0, #00d4ff);
  position: relative;
  box-shadow: 0 0 24px rgba(0,212,255,0.45), inset 0 0 12px rgba(255,255,255,0.4);
}
.brand-mark::after {
  content: ""; position: absolute; inset: 5px; border-radius: 6px;
  background: linear-gradient(135deg, #060a16, #0c1326);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
}
.brand-mark::before {
  content: ""; position: absolute; inset: 11px; border-radius: 50%;
  background: radial-gradient(circle, #6ae7ff, #7b61ff);
  z-index: 1;
  box-shadow: 0 0 14px rgba(0,212,255,0.7);
}
.brand-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.01em;
}
.brand-name span { color: var(--cyan); }
.sidebar.col .brand-name, .sidebar.col .nav-item-label, .sidebar.col .nav-section { display: none; }

.nav-section {
  font-size: 10px; font-weight: 600; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-3);
  padding: 14px 10px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 10px;
  border-radius: var(--r-md);
  color: var(--text-1);
  cursor: pointer;
  position: relative;
  transition: all 180ms ease;
  font-size: 13px; font-weight: 500;
  border: 1px solid transparent;
}
.nav-item:hover {
  background: var(--glass-bg);
  color: var(--text-0);
}
.nav-item.active {
  background: linear-gradient(135deg, rgba(0,212,255,0.16), rgba(123,97,255,0.12));
  color: #fff;
  border: 1px solid rgba(0,212,255,0.25);
  box-shadow: 0 0 0 1px rgba(0,212,255,0.05) inset, 0 0 24px rgba(0,212,255,0.12);
}
.nav-item.active::before {
  content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px;
  background: linear-gradient(180deg, var(--cyan), var(--violet));
  border-radius: 0 3px 3px 0;
  box-shadow: 0 0 12px var(--cyan);
}
.nav-item .ic { width: 18px; height: 18px; flex-shrink: 0; color: inherit; }

.sidebar-foot {
  margin-top: auto;
  padding: 10px;
  border-top: 1px solid var(--glass-border);
  display: flex; flex-direction: column; gap: 10px;
}
.usage-mini {
  font-size: 11px; color: var(--text-2);
  display: flex; flex-direction: column; gap: 6px;
}
.usage-bar {
  height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06); overflow: hidden;
}
.usage-bar > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--violet));
  box-shadow: 0 0 10px var(--cyan);
}
.collapse-btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 8px;
  background: transparent; border: 1px solid var(--glass-border);
  border-radius: var(--r-md); color: var(--text-2);
  cursor: pointer; transition: all 150ms;
}
.collapse-btn:hover { color: var(--text-0); background: var(--glass-bg); }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 4;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 28px;
  background: rgba(8, 12, 24, 0.55);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--glass-border);
}
.workspace-pill {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 12px 6px 6px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  cursor: pointer;
}
.workspace-pill .ws-icon {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, #00d4ff, #7b61ff);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 12px;
  box-shadow: 0 0 12px rgba(0,212,255,0.4);
}
.workspace-pill .ws-name { font-size: 13px; font-weight: 500; }
.workspace-pill .ws-chev { color: var(--text-3); }

.topbar .spacer { flex: 1; }

.agent-count {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  font-size: 12px;
}
.agent-count .live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 10px var(--emerald);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,229,160,0.7), 0 0 12px var(--emerald); }
  50% { box-shadow: 0 0 0 6px rgba(0,229,160,0), 0 0 16px var(--emerald); }
}

.searchbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  min-width: 280px;
}
.searchbar input {
  background: transparent; border: 0; outline: 0;
  flex: 1; font-size: 13px; color: var(--text-0);
}
.searchbar input::placeholder { color: var(--text-3); }
.searchbar kbd {
  font-family: var(--font-mono); font-size: 10px;
  padding: 2px 6px; border-radius: 5px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  color: var(--text-2);
}

.icon-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  color: var(--text-1);
  cursor: pointer;
  position: relative;
  transition: all 150ms;
}
.icon-btn:hover { background: var(--glass-bg-strong); color: var(--text-0); }
.icon-btn .badge-dot {
  position: absolute; top: 8px; right: 8px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--rose); box-shadow: 0 0 8px var(--rose);
}

.avatar {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #7b61ff, #00d4ff);
  display: grid; place-items: center;
  font-weight: 600; font-size: 12px;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.1) inset;
}

/* ---------- Glass primitive ---------- */
.glass {
  position: relative;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow:
    0 1px 0 0 var(--glass-highlight) inset,
    0 0 0 1px rgba(0,0,0,0.4),
    0 30px 60px -30px rgba(0,0,0,0.6);
}
.glass::before {
  content: ""; position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 30%, transparent 70%, rgba(0,0,0,0.15));
  pointer-events: none;
}
.glass.hover:hover {
  transform: translateY(-2px);
  border-color: var(--glass-border-strong);
  background: var(--glass-bg-strong);
  transition: all 200ms ease;
}
.glass.tint-cyan { box-shadow: 0 1px 0 var(--glass-highlight) inset, 0 0 0 1px rgba(0,212,255,0.18), 0 30px 60px -30px rgba(0,212,255,0.3); border-color: rgba(0,212,255,0.25); }
.glass.tint-violet { box-shadow: 0 1px 0 var(--glass-highlight) inset, 0 0 0 1px rgba(123,97,255,0.18), 0 30px 60px -30px rgba(123,97,255,0.3); border-color: rgba(123,97,255,0.25); }

/* ---------- Main / page transitions ---------- */
.main {
  min-width: 0;
  position: relative;
}
.page {
  padding: 28px;
  animation: pageIn 280ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px; margin-bottom: 22px;
}
.page-title {
  font-family: var(--font-display);
  font-weight: 600; font-size: 30px;
  letter-spacing: -0.02em; margin: 0;
  background: linear-gradient(135deg, #ffffff, #cfd6ee 60%, #8a93ab);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.page-sub {
  color: var(--text-2); font-size: 13px; margin: 6px 0 0;
}
.section-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--text-3);
  margin: 0 0 12px;
}

/* ---------- KPI card ---------- */
.kpi-card {
  padding: 20px 20px 18px;
  display: flex; flex-direction: column; gap: 12px;
  min-height: 132px;
}
.kpi-head {
  display: flex; align-items: center; justify-content: space-between;
}
.kpi-label {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-2); font-weight: 600;
}
.kpi-icon {
  width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  color: var(--cyan);
}
.kpi-value {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 36px;
  letter-spacing: -0.025em;
  line-height: 1;
  display: flex; align-items: baseline; gap: 6px;
}
.kpi-value .unit { font-size: 16px; color: var(--text-2); font-weight: 500; }
.kpi-foot {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--text-2);
}
.delta {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
}
.delta.up { color: var(--emerald); background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.2); }
.delta.down { color: var(--rose); background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.2); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px;
  border-radius: 10px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  color: var(--text-0);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: all 160ms ease;
}
.btn:hover { background: var(--glass-bg-strong); border-color: var(--glass-border-strong); }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
.btn-primary {
  background: linear-gradient(135deg, #00d4ff, #4d8bff);
  border: 1px solid rgba(0,212,255,0.5);
  color: #04070f;
  font-weight: 600;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.15) inset, 0 6px 24px -4px rgba(0,212,255,0.55);
}
.btn-primary:hover {
  filter: brightness(1.1);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.2) inset, 0 8px 32px -2px rgba(0,212,255,0.7);
}
.btn-violet {
  background: linear-gradient(135deg, #7b61ff, #a594ff);
  border: 1px solid rgba(123,97,255,0.5);
  color: #fff; font-weight: 600;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.15) inset, 0 6px 24px -4px rgba(123,97,255,0.5);
}
.btn-danger {
  background: linear-gradient(135deg, rgba(255,77,109,0.16), rgba(255,77,109,0.06));
  border: 1px solid rgba(255,77,109,0.4);
  color: #ffa9b9;
  box-shadow: 0 0 24px -4px rgba(255,77,109,0.3);
}
.btn-ghost { background: transparent; }

/* ---------- Status pill ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  color: var(--text-1);
  letter-spacing: 0.02em;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.live { color: var(--emerald); background: rgba(0,229,160,0.1); border-color: rgba(0,229,160,0.3); }
.pill.live .dot { animation: pulse 1.6s ease-in-out infinite; }
.pill.idle { color: var(--text-2); background: rgba(138,147,171,0.08); border-color: rgba(138,147,171,0.2); }
.pill.paused { color: var(--amber); background: rgba(255,179,71,0.1); border-color: rgba(255,179,71,0.3); }
.pill.error { color: var(--rose); background: rgba(255,77,109,0.1); border-color: rgba(255,77,109,0.3); }
.pill.cyan { color: var(--cyan); background: rgba(0,212,255,0.08); border-color: rgba(0,212,255,0.28); }
.pill.violet { color: var(--violet-soft); background: rgba(123,97,255,0.1); border-color: rgba(123,97,255,0.28); }
.pill.amber { color: var(--amber); background: rgba(255,179,71,0.08); border-color: rgba(255,179,71,0.28); }
.pill.emerald { color: var(--emerald); background: rgba(0,229,160,0.08); border-color: rgba(0,229,160,0.28); }
.pill.rose { color: var(--rose); background: rgba(255,77,109,0.08); border-color: rgba(255,77,109,0.28); }
.pill.outline { background: transparent; }

/* ---------- Tabs ---------- */
.tabs {
  display: inline-flex; padding: 4px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  gap: 2px;
}
.tab {
  padding: 7px 14px;
  border-radius: 9px;
  font-size: 12px; font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  transition: all 150ms;
}
.tab:hover { color: var(--text-0); }
.tab.active {
  background: linear-gradient(135deg, rgba(0,212,255,0.18), rgba(123,97,255,0.14));
  color: #fff;
  border-color: rgba(0,212,255,0.3);
  box-shadow: 0 0 12px rgba(0,212,255,0.15);
}

/* ---------- Inputs ---------- */
.input, .textarea, .select {
  width: 100%;
  padding: 10px 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  color: var(--text-0);
  font-size: 13px;
  outline: none;
  transition: all 150ms;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: rgba(0,212,255,0.5);
  background: rgba(0,212,255,0.04);
  box-shadow: 0 0 0 3px rgba(0,212,255,0.12);
}
.input::placeholder, .textarea::placeholder { color: var(--text-3); }
.textarea { resize: vertical; min-height: 110px; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.field-label {
  display: block; font-size: 11px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-2);
  margin-bottom: 6px;
}

/* ---------- Toggle ---------- */
.toggle {
  width: 38px; height: 22px;
  background: rgba(255,255,255,0.06);
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  position: relative; cursor: pointer;
  transition: all 180ms;
  flex-shrink: 0;
}
.toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--text-2);
  transition: all 180ms;
}
.toggle.on {
  background: linear-gradient(135deg, rgba(0,212,255,0.4), rgba(0,212,255,0.2));
  border-color: rgba(0,212,255,0.5);
  box-shadow: 0 0 12px rgba(0,212,255,0.3);
}
.toggle.on::after {
  left: 18px; background: #fff;
  box-shadow: 0 0 8px rgba(0,212,255,0.6);
}

/* ---------- Agent avatar ---------- */
.agent-avatar {
  width: 48px; height: 48px; border-radius: 14px;
  display: grid; place-items: center;
  position: relative;
  flex-shrink: 0;
